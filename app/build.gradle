plugins {
    id "com.android.application"
    id "org.jetbrains.kotlin.android"
}

android {
    namespace "com.e4heart"
    compileSdk 34

    defaultConfig {
        applicationId "com.e4heart"
        minSdk 28
        targetSdk 34
        versionCode 1
        versionName "1.0"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile("proguard-android-optimize.txt"), "proguard-rules.pro"
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
    kotlinOptions {
        jvmTarget = "1.8"
    }
    buildFeatures {
        compose true
    }
    composeOptions {
        kotlinCompilerExtensionVersion "1.5.8"
    }
}

dependencies {
    implementation "androidx.core:core-ktx:1.12.0"
    implementation "androidx.lifecycle:lifecycle-runtime-ktx:2.7.0"
    implementation "androidx.activity:activity-compose:1.8.2"
    
    // Compose for Wear OS
    implementation "androidx.wear.compose:compose-material:1.3.0"
    implementation "androidx.wear.compose:compose-foundation:1.3.0"
    implementation "androidx.wear.compose:compose-navigation:1.3.0"
    
    // Complications
    implementation "androidx.wear.watchface:watchface-complications-data-source-ktx:1.2.1"
    
    // Watch Face
    implementation "androidx.wear.watchface:watchface:1.2.1"
    implementation "androidx.wear.watchface:watchface-complications-rendering:1.2.1"
    
    // UI Tooling
    implementation "androidx.compose.ui:ui:1.6.1"
    implementation "androidx.compose.ui:ui-tooling-preview:1.6.1"

    // Tiles
    implementation "androidx.wear.tiles:tiles:1.3.0"
    implementation "androidx.wear.protolayout:protolayout:1.1.0"
    implementation "androidx.wear.protolayout:protolayout-material:1.1.0"
    implementation "androidx.wear.protolayout:protolayout-expression:1.1.0"
    implementation "com.google.guava:guava:31.1-android"
}
